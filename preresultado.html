<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222222">
    <title>¡Tu cumbia ya está lista! | Cumbia e IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="preresultado.css">
</head>
<body>
    <main class="result">
        <header class="result__header">
            <h1 class="result__title">
                <span class="result__title-back" aria-hidden="true">¡Tu cumbia ya está lista!</span>
                <span class="result__title-front">¡Tu cumbia ya está lista!</span>
            </h1>
            <p class="result__subtitle">
                Seguí <span>recorriendo</span> la experiencia para<br class="result__subtitle-break">
                descubrir el <span>resultado final.</span>
            </p>
        </header>

        <section class="result-teaser" aria-label="Vista previa de la canción">
            <span class="result-teaser__question result-teaser__question--right" aria-hidden="true">?</span>
            <div class="result-teaser__player" aria-hidden="true">
                <img class="result-teaser__cover" src="imagenes/cancionkode.png" alt="">
                <div class="result-teaser__details">
                    <span class="result-teaser__song">Tu canción</span>
                    <span class="result-teaser__artist">feat. IA</span>
                    <div class="result-teaser__wave" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div class="result-teaser__controls">
                        <span class="result-teaser__skip" aria-hidden="true">◀</span>
                        <span class="result-teaser__play" aria-hidden="true">▶</span>
                        <span class="result-teaser__skip" aria-hidden="true">▶</span>
                        <span class="result-teaser__track" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
            <span class="result-teaser__question result-teaser__question--left" aria-hidden="true">?</span>
        </section>

        <footer class="result__footer">
            <a class="result__hint" id="continue-link" href="resultadocancion.html" aria-label="Continuar para descubrir el resultado final">
                <span>¡Presioná el botón</span>
                <img src="imagenes/playok.png" alt="OK" class="result__ok">
                <span>en tu teclado para continuar!</span>
            </a>
        </footer>
    </main>
    <script src="serial.js" defer></script>
    <script>
        const continueLink = document.querySelector("#continue-link");
        continueLink.href = `nucleo3.html${window.location.search}`;

        document.addEventListener("keydown", (event) => {
            if (
                event.key === "Enter" &&
                !event.repeat &&
                !(event.target instanceof Element && event.target.closest("a, audio, button, input, select, textarea"))
            ) {
                window.location.href = continueLink.href;
            }
        });
    </script>
</body>
</html>
