<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222222">
    <title>Creá tu propia cumbia | Cumbia e IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilonucleo2.css">
</head>
<body>
    <main class="creator" inert aria-hidden="true">
        <button class="creator__back" id="back-button" type="button">
            ¡Presioná
            <svg class="creator__back-icon" viewBox="0 0 32 32" role="img" aria-label="botón de volver atrás">
                <rect width="32" height="32" rx="3" fill="#f1ff00"/>
                <rect x="9" y="8" width="3.2" height="16" fill="#ff0054"/>
                <path d="M23 8v16L13.5 16z" fill="#ff0054"/>
            </svg>
            para volver atrás!
        </button>
        <img class="creator__star creator__star--yellow" src="imagenes/estrellararaama.png" alt="" aria-hidden="true">
        <img class="creator__star creator__star--green" src="imagenes/estrellararaver.png" alt="" aria-hidden="true">
        <h1 class="creator__title">
            <span class="creator__title-back" aria-hidden="true">¡CREÁ TU PROPIA CUMBIA!</span>
            <span class="creator__title-front">¡CREÁ TU PROPIA CUMBIA!</span>
        </h1>
        <h2 class="creator__step" id="step-title">PASO 1: Elegí el instrumento predominante</h2>

        <section class="creator__screen" aria-labelledby="step-title">
            <img class="creator__image" id="step-image" src="imagenes/keytar.png" alt="Keytar">
            <div class="creator__waveform" id="step-waveform" role="img" aria-label="Onda de voz animada" hidden>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="creator__option-list">
                <div class="creator__options" id="options" aria-label="Elegí una opción"></div>
                <p class="creator__hint">
                    ¡Elegí la opción que más te guste y presioná
                    <img src="imagenes/playok.png" alt="botón de continuar">
                    para continuar!
                </p>
            </div>
        </section>
    </main>
    <aside class="creator-tutorial" id="creator-tutorial" role="status" aria-live="polite">
        <div class="creator-tutorial__content">
            <div class="creator-tutorial__message">
                <img class="creator-tutorial__knob" src="imagenes/perilla-tutorial.svg" alt="">
                <p>Girá la perilla para escuchar las opciones.</p>
            </div>
            <img
                class="creator-tutorial__character"
                src="imagenes/muneco%20tutorial%20nucleo1.png"
                alt=""
            >
        </div>
    </aside>
       <script src="serial.js" defer></script>
    <script>
        const steps = [
            {
                title: "PASO 1: Elegí el instrumento predominante",
                image: "imagenes/keytar.png",
                alt: "Keytar",
                options: [
                    { name: "KEYTAR", image: "imagenes/keytar.png", alt: "Keytar", sound: "musica/keytar%20recortado.mp4"},
                    { name: "GÜIRO", image: "imagenes/guiro.png", alt: "Güiro", sound: "musica/GÜIRO.mp3" },
                    { name: "TIMBAL", image: "imagenes/timbal.png", alt: "Timbal", sound: "musica/TIMBAL.mp3" }
                ]
            },
            {
                title: "PASO 2: Elegí la temática a cantar",
                image: "imagenes/corazonroto.png",
                alt: "Corazón roto",
                options: [
                    { name: "DESAMOR", image: "imagenes/corazonroto.png", alt: "Corazón roto", sound: "musica/DESAMOR.mp3" },
                    { name: "AMISTAD", image: "imagenes/caritafeliz.png", alt: "Carita sonriente", sound: "musica/AMISTAD.mp3" },
                    { name: "FIESTA", image: "imagenes/fiesta.png", alt: "Fiesta", sound: "musica/FIESTA.mp3" }
                ]
            },
            {
                title: "PASO 3: Elegí el tipo de voz a usar",
                image: "imagenes/microfono.png",
                alt: "Micrófono",
                options: [
                    { name: "VOZ 1", image: "imagenes/ondamusical.png", alt: "Micrófono, voz 1", sound: "musica/VOZ 1.mp3" },
                    { name: "VOZ 2", image: "imagenes/ondamusical.png", alt: "Micrófono, voz 2", sound: "musica/VOZ 2.mp3" },
                    { name: "VOZ 3", image: "imagenes/ondamusical.png", alt: "Micrófono, voz 3", sound: "musica/VOZ 3.mp3" }
                ]
            }
        ];

        const selections = [null, null, null];
        const title = document.querySelector("#step-title");
        const image = document.querySelector("#step-image");
        const waveform = document.querySelector("#step-waveform");
        const options = document.querySelector("#options");
        const tutorial = document.querySelector("#creator-tutorial");
        const creator = document.querySelector(".creator");
        const instrumentAudio = new Audio();
        let currentStep = 0;

        function playOptionSound(option) {
            instrumentAudio.pause();
            instrumentAudio.currentTime = 0;
            if (!option.sound) return;

            instrumentAudio.src = option.sound;
            instrumentAudio.play().catch((error) => {
                console.error("No se pudo reproducir el sonido de la opción.", error);
            });
        }

        function previewOption(option) {
            const showWaveform = option.image === "imagenes/ondamusical.png";
            image.hidden = showWaveform;
            waveform.hidden = !showWaveform;
            if (!showWaveform) {
                image.src = option.image;
                image.alt = option.alt;
            }
        }

        function showStep() {
            const step = steps[currentStep];
            title.textContent = step.title;
            previewOption(selections[currentStep] || step.options[0]);
            options.replaceChildren();

            step.options.forEach((option) => {
                const button = document.createElement("button");
                button.className = "creator__option";
                button.type = "button";
                button.textContent = option.name;
                button.setAttribute("aria-pressed", String(selections[currentStep]?.name === option.name));
                button.addEventListener("pointerenter", () => {
                    previewOption(option);
                    if (option.sound) playOptionSound(option);
                });
                button.addEventListener("pointerleave", () => {
                    if (option.sound) {
                        instrumentAudio.pause();
                        instrumentAudio.currentTime = 0;
                    }
                    previewOption(selections[currentStep] || step.options[0]);
                });
                button.addEventListener("focus", () => previewOption(option));
                button.addEventListener("blur", () => {
                    previewOption(selections[currentStep] || step.options[0]);
                });
                button.addEventListener("click", () => {
                    if (option.sound) {
                        instrumentAudio.pause();
                        instrumentAudio.currentTime = 0;
                    }
                    selections[currentStep] = option;
                    if (currentStep < steps.length - 1) {
                        currentStep += 1;
                        showStep();
                        return;
                    }

                    options.querySelectorAll(".creator__option").forEach((choice) => {
                        const isSelected = choice === button;
                        choice.classList.toggle("is-selected", isSelected);
                        choice.setAttribute("aria-pressed", String(isSelected));
                    });
                    const selectionsQuery = new URLSearchParams({
                        instrument: selections[0].name,
                        theme: selections[1].name,
                        voice: selections[2].name
                    });
                    window.location.href = `preresultado.html?${selectionsQuery}`;
                });
                options.append(button);
            });
        }
        // ----- Volver atrás -----
        function irAtras() {
            if (!tutorial.classList.contains("is-dismissed")) return;
            instrumentAudio.pause();
            instrumentAudio.currentTime = 0;
            if (currentStep > 0) {
                currentStep -= 1;
                showStep();
            } else {
                window.location.href = "nucleo1.html";
            }
        }
        document.querySelector("#back-button").addEventListener("click", irAtras);
        document.addEventListener("boton-atras-arduino", irAtras);

           // ----- Potenciómetro y botón del Arduino -----
        let potIndex = 0;

      function resaltarOpcion(index) {
    const botones = options.querySelectorAll(".creator__option");
    botones.forEach((boton, i) => {
        boton.classList.toggle("is-pot", i === index);
    });
    const opcion = steps[currentStep].options[index];
    if (opcion) {
        previewOption(opcion);
        playOptionSound(opcion);   // <- esto faltaba
    }
}
        document.addEventListener("potenciometro", (e) => {
            if (!tutorial.classList.contains("is-dismissed")) return;
            const cantidad = steps[currentStep].options.length;
            const index = Math.min(cantidad - 1, Math.floor((e.detail / 1024) * cantidad));
            if (index !== potIndex) {
                potIndex = index;
                resaltarOpcion(potIndex);
            }
        });

        // Botón físico: confirma la opción elegida con el potenciómetro
        document.addEventListener("boton-arduino", () => {
            if (!tutorial.classList.contains("is-dismissed")) return;
            const botones = options.querySelectorAll(".creator__option");
            if (botones[potIndex]) botones[potIndex].click();
        });

        showStep();
        window.setTimeout(() => {
            tutorial.classList.add("is-dismissed");
            tutorial.setAttribute("aria-hidden", "true");
            creator.removeAttribute("inert");
            creator.removeAttribute("aria-hidden");
        }, 6000);
    </script>
</body>
</html>
