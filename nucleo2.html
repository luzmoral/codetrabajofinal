<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222222">
    <title>Creá tu propia cumbia | Cumbia e IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilonucleo2.css">
</head>
<body>
    <main class="creator">
        <img class="creator__star creator__star--yellow" src="imagenes/estrellararaama.png" alt="" aria-hidden="true">
        <img class="creator__star creator__star--green" src="imagenes/estrellararaver.png" alt="" aria-hidden="true">
        <h1 class="creator__title">
            <span class="creator__title-back" aria-hidden="true">¡CREÁ TU PROPIA CUMBIA!</span>
            <span class="creator__title-front">¡CREÁ TU PROPIA CUMBIA!</span>
        </h1>
        <h2 class="creator__step" id="step-title">PASO 1: Elegí el instrumento predominante</h2>

        <section class="creator__screen" aria-labelledby="step-title">
            <img class="creator__image" id="step-image" src="imagenes/keytar.png" alt="Keytar">
            <div class="creator__waveform" id="step-waveform" role="img" aria-label="Onda de voz animada" hidden>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="creator__options" id="options" aria-label="Elegí una opción"></div>
        </section>
    </main>
    <script src="serial.js"></script>
    <script>
        const steps = [
            {
                title: "PASO 1: Elegí el instrumento predominante",
                image: "imagenes/keytar.png",
                alt: "Keytar",
                options: [
                    { name: "KEYTAR", image: "imagenes/keytar.png", alt: "Keytar" },
                    { name: "GÜIRO", image: "imagenes/guiro.png", alt: "Güiro" },
                    { name: "TIMBAL", image: "imagenes/timbal.png", alt: "Timbal" }
                ]
            },
            {
                title: "PASO 2: Elegí la temática a cantar",
                image: "imagenes/corazonroto.png",
                alt: "Corazón roto",
                options: [
                    { name: "DESAMOR", image: "imagenes/corazonroto.png", alt: "Corazón roto" },
                    { name: "AMISTAD", image: "imagenes/caritafeliz.png", alt: "Carita sonriente" },
                    { name: "FIESTA", image: "imagenes/fiesta.png", alt: "Fiesta" }
                ]
            },
            {
                title: "PASO 3: Elegí el tipo de voz a usar",
                image: "imagenes/microfono.png",
                alt: "Micrófono",
                options: [
                    { name: "VOZ 1", image: "imagenes/ondamusical.png", alt: "Micrófono, voz 1" },
                    { name: "VOZ 2", image: "imagenes/ondamusical.png", alt: "Micrófono, voz 2" },
                    { name: "VOZ 3", image: "imagenes/ondamusical.png", alt: "Micrófono, voz 3" }
                ]
            }
        ];

        const selections = [null, null, null];
        const title = document.querySelector("#step-title");
        const image = document.querySelector("#step-image");
        const waveform = document.querySelector("#step-waveform");
        const options = document.querySelector("#options");
        let currentStep = 0;

        function previewOption(option) {
            const showWaveform = option.image === "imagenes/ondamusical.png";
            image.hidden = showWaveform;
            waveform.hidden = !showWaveform;
            if (!showWaveform) {
                image.src = option.image;
                image.alt = option.alt;
            }
        }

        function showStep() {
            const step = steps[currentStep];
            title.textContent = step.title;
            previewOption(selections[currentStep] || step.options[0]);
            options.replaceChildren();

            step.options.forEach((option) => {
                const button = document.createElement("button");
                button.className = "creator__option";
                button.type = "button";
                button.textContent = option.name;
                button.setAttribute("aria-pressed", String(selections[currentStep]?.name === option.name));
                button.addEventListener("pointerenter", () => previewOption(option));
                button.addEventListener("pointerleave", () => {
                    previewOption(selections[currentStep] || step.options[0]);
                });
                button.addEventListener("focus", () => previewOption(option));
                button.addEventListener("blur", () => {
                    previewOption(selections[currentStep] || step.options[0]);
                });
                button.addEventListener("click", () => {
                    selections[currentStep] = option;
                    if (currentStep < steps.length - 1) {
                        currentStep += 1;
                        showStep();
                        return;
                    }

                    options.querySelectorAll(".creator__option").forEach((choice) => {
                        const isSelected = choice === button;
                        choice.classList.toggle("is-selected", isSelected);
                        choice.setAttribute("aria-pressed", String(isSelected));
                    });
                    window.location.href = "nucleo3.html";
                });
                options.append(button);
            });
        }
           // ----- Potenciómetro y botón del Arduino -----
        let potIndex = 0;

       function resaltarOpcion(index) {
    const botones = options.querySelectorAll(".creator__option");
    botones.forEach((boton, i) => {
        boton.classList.toggle("is-pot", i === index);
    });
    const opcion = steps[currentStep].options[index];
    if (opcion) previewOption(opcion);   // cambia la foto, sin focus()
}
        document.addEventListener("potenciometro", (e) => {
            const cantidad = steps[currentStep].options.length;
            const index = Math.min(cantidad - 1, Math.floor((e.detail / 1024) * cantidad));
            if (index !== potIndex) {
                potIndex = index;
                resaltarOpcion(potIndex);
            }
        });

        // Botón físico: confirma la opción elegida con el potenciómetro
        document.addEventListener("boton-arduino", () => {
            const botones = options.querySelectorAll(".creator__option");
            if (botones[potIndex]) botones[potIndex].click();
        });

        showStep();
    </script>
</body>
</html>
