<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222222">
    <title>Tu cumbia con IA | Cumbia e IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="resultado.css">
</head>
<body>
    <main class="result">
        <header class="result__header">
            <h1 class="result__title">Tu cumbia con IA</h1>
            <p class="result__subtitle">¡Escuchá tu resultado!</p>
            <div class="result__choices" id="result-choices" role="list" aria-label="Tus elecciones"></div>
        </header>

        <section class="result-player" aria-label="Reproductor de la canción">
            <img
                class="result-player__cover"
                src="imagenes/imagenfinal.png"
                alt="Portada de la canción"
            >
            <div class="result-player__details">
                <h2 class="result-player__song">TU CANCIÓN</h2>
                <p class="result-player__artist">ft IA</p>
                <audio
                    id="result-audio"
                    class="result-player__audio"
                    controls
                    preload="none"
                    aria-label="Escuchar tu canción"
                ></audio>
            </div>
        </section>

        <footer class="result__footer">
            <a class="result__hint" href="final.html" aria-label="Continuar a la pantalla final">
                <span>¡Presioná el botón</span>
                <img src="imagenes/playok.png" alt="OK" class="result__ok">
                <span>en tu teclado para continuar!</span>
            </a>

        </footer>
    </main>
    <script src="canciones.js"></script>
       <script src="serial.js" defer></script>
    <script>
        const selection = new URLSearchParams(window.location.search);
        const instrument = selection.get("instrument")?.toLocaleUpperCase("es");
        const theme = selection.get("theme")?.toLocaleUpperCase("es");
        const voice = selection.get("voice")?.toLocaleUpperCase("es");
        const selectedSong = window.cumbiaSongs[instrument]?.[theme]?.[voice];
        const choiceDetails = {
            instrument: {
                KEYTAR: { name: "Keytar", image: "imagenes/keytarim.png" },
                "GÜIRO": { name: "Güiro", image: "imagenes/guiroim.png" },
                TIMBAL: { name: "Timbal", image: "imagenes/timbalim.png" }
            },
            theme: {
                DESAMOR: { name: "Desamor", image: "imagenes/desamorim.png" },
                AMISTAD: { name: "Amistad", image: "imagenes/amistadim.png" },
                FIESTA: { name: "Fiesta", image: "imagenes/fiestaim.png" }
            },
            voice: {
                "VOZ 1": { name: "Voz 1", image: "imagenes/voz1im.png" },
                "VOZ 2": { name: "Voz 2", image: "imagenes/voz2im.png" },
                "VOZ 3": { name: "Voz 3", image: "imagenes/voz3im.png" }
            }
        };
        const choices = [
            choiceDetails.instrument[instrument],
            choiceDetails.theme[theme],
            choiceDetails.voice[voice]
        ].filter(Boolean);
        const choicesContainer = document.querySelector("#result-choices");
        choices.forEach((choice) => {
            const item = document.createElement("div");
            item.className = "result__choice";
            item.setAttribute("role", "listitem");

            const icon = document.createElement("img");
            icon.className = "result__choice-icon";
            icon.src = choice.image;
            icon.alt = "";

            const name = document.createElement("span");
            name.className = "result__choice-name";
            name.textContent = choice.name;

            item.append(icon, name);
            choicesContainer.append(item);
        });

        if (selectedSong) {
            const audio = document.querySelector("#result-audio");
            audio.src = encodeURI(`musica/${selectedSong}`);
            audio.load();
        }

        document.addEventListener("keydown", (event) => {
            if (
                event.key === "Enter" &&
                !event.repeat &&
                !(event.target instanceof Element && event.target.closest("a, audio, button, input, select, textarea"))
            ) {
                window.location.href = "final.html";
            }
        });
    </script>
</body>
</html>
